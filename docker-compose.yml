services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-mini_bank}
    ports:
      # Exposto só para a própria máquina (acesso por ferramentas como DBeaver/psql).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      # Montado a partir das mesmas variáveis do serviço db, para os dois nunca divergirem.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bank_user}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${POSTGRES_DB:-mini_bank}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
